<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="NQ Crown: tienda en línea de gorras, viseras y buckets.">
  <title>NQ Crown · Gorras con carácter</title>
  <link rel="icon" href="img/logo-nq-crown.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=8">
</head>
<body>
  <!-- Primer elemento al presionar Tab: salta el menú (WCAG 2.4.1) -->
  <button class="skip" type="button" data-action="skip">Saltar al contenido principal</button>

  <!-- Encabezado común (se oculta en la bienvenida) -->
  <header class="topbar" id="topbar">
    <div class="wrap topbar__in">
      <a class="brand" href="#/catalogo">
        <img src="img/logo-nq-crown.png" alt="" width="40" height="40">
        <span>NQ Crown</span>
        <span class="sr-only">, ir al catálogo</span>
      </a>
      <nav class="mainnav" aria-label="Menú principal">
        <a href="#/catalogo" data-nav="catalogo">Catálogo</a>
        <a href="#/catalogo?f=fav" data-nav="favoritos">Favoritos</a>
      </nav>
      <form class="search" id="searchForm" role="search">
        <label class="sr-only" for="searchInput">Buscar gorra por nombre, equipo o color</label>
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="searchInput" type="search" placeholder="Buscar gorra" aria-keyshortcuts="/" autocomplete="off">
        <kbd class="kbd" aria-hidden="true" title="Atajo de teclado">/</kbd>
      </form>
      <a class="account" id="accountLink" href="#/ingresar">Ingresar</a>
      <a class="cartbtn" id="cartBtn" href="#/carrito">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 4h2l2.4 11.2a1.5 1.5 0 0 0 1.5 1.2h8.6a1.5 1.5 0 0 0 1.5-1.1L21 8H6.2"/><circle cx="9.5" cy="20" r="1.3"/><circle cx="17.5" cy="20" r="1.3"/></svg>
        <span>Carrito (<b id="cartCount">0</b>)</span>
        <span class="sr-only" id="cartSr">, 0 productos</span>
      </a>
    </div>
  </header>

  <main id="app" tabindex="-1"></main>

  <footer class="footer" id="footer">
    <div class="wrap footer__in">
      <div>
        <strong>NQ Crown</strong>
        <small>Gorras con carácter</small>
      </div>
      <nav aria-label="Ayuda e información">
        <a href="#/info/ayuda">Ayuda</a> · <a href="#/info/retiro">Retiro en el local</a> · <a href="#/info/devoluciones">Devoluciones</a> · <a href="#/info/contacto">Contacto</a> · <a href="#/info/accesibilidad">Accesibilidad</a>
      </nav>
      <small class="copy">© 2026 NQ Crown</small>
    </div>
  </footer>

  <!-- Aviso visible (microinteracciones) y región solo para lectores de pantalla -->
  <div class="toast" id="toast" role="status" aria-live="polite">
    <span id="toastMsg"></span>
    <button type="button" class="toast__btn" id="toastBtn" hidden></button>
  </div>
  <div class="sr-only" id="srLive" aria-live="polite"></div>

  <noscript><p class="wrap">Esta tienda necesita JavaScript activado para funcionar.</p></noscript>

  <script src="js/data.js?v=8"></script>
  <script src="js/app.js?v=10"></script>
</body>
</html>
