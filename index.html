<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="NQ Crown: tienda en línea de gorras, viseras y buckets.">
  <title>NQ Crown · Gorras con carácter</title>
  <link rel="icon" href="img/logo-nq-crown.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=25">
</head>
<body>
  <!-- Primer elemento al presionar Tab: salta el menú (WCAG 2.4.1) -->
  <button class="skip" type="button" data-action="skip">Saltar al contenido principal</button>

  <!-- Encabezado común (se oculta en la bienvenida) -->
  <header class="topbar" id="topbar">
    <div class="wrap topbar__in">
      <a class="brand" href="#/catalogo">
        <img src="img/logo-nq-crown.png" alt="" width="40" height="40">
        <span>NQ Crown</span>
        <span class="sr-only">, ir al catálogo</span>
      </a>
      <nav class="mainnav" aria-label="Menú principal">
        <a href="#/catalogo" data-nav="catalogo">Catálogo</a>
        <!-- Menús desplegables: equipos por liga y modelos de gorra (se llenan con la base) -->
        <button type="button" class="mainnav__btn" data-action="megamenu" aria-expanded="false" aria-controls="megaEquipos">Equipos <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m6 9 6 6 6-6"/></svg></button>
        <button type="button" class="mainnav__btn" data-action="megamenu" aria-expanded="false" aria-controls="megaModelos">Modelos <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m6 9 6 6 6-6"/></svg></button>
        <a href="#/catalogo?f=fav" data-nav="favoritos">Favoritos</a>
      </nav>
      <form class="search" id="searchForm" role="search">
        <label class="sr-only" for="searchInput">Buscar gorra por nombre, equipo o color</label>
        <button type="submit" class="search__btn" aria-label="Buscar" title="Buscar"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
        <input id="searchInput" type="search" placeholder="Buscar gorra" aria-keyshortcuts="/" autocomplete="off">
        <kbd class="kbd" aria-hidden="true" title="Atajo de teclado">/</kbd>
      </form>
      <!-- Sin sesión: enlace «Ingresar». Con sesión: botón que abre el menú de la cuenta -->
      <div class="account" id="account">
        <a class="account__link" id="accountLink" href="#/ingresar">Ingresar</a>
        <button type="button" class="account__btn" id="accountBtn" aria-expanded="false" aria-controls="accountMenu" hidden>
          <span class="account__avatar" id="accountAvatar" aria-hidden="true"></span>
          <span id="accountName"></span><span class="sr-only">: menú de mi cuenta</span>
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m6 9 6 6 6-6"/></svg>
        </button>
        <ul class="account__menu" id="accountMenu" hidden>
          <li><a href="#/perfil">Mis datos</a></li>
          <li><a href="#/pedidos">Mis pedidos</a></li>
          <li><a href="#/catalogo?f=fav">Mis favoritas</a></li>
          <li><a href="#/salir">Cerrar sesión</a></li>
        </ul>
      </div>
      <a class="cartbtn" id="cartBtn" href="#/carrito">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 4h2l2.4 11.2a1.5 1.5 0 0 0 1.5 1.2h8.6a1.5 1.5 0 0 0 1.5-1.1L21 8H6.2"/><circle cx="9.5" cy="20" r="1.3"/><circle cx="17.5" cy="20" r="1.3"/></svg>
        <span>Carrito (<strong id="cartCount">0</strong>)</span>
        <span class="sr-only" id="cartSr">, 0 productos</span>
      </a>
    </div>
    <div class="mega" id="megaEquipos" hidden></div>
    <div class="mega" id="megaModelos" hidden></div>
  </header>

  <main id="app" tabindex="-1"></main>

  <footer class="footer" id="footer">
    <div class="wrap footer__in">
      <div>
        <strong>NQ Crown</strong>
        <span class="sm">Gorras con carácter</span>
      </div>
      <nav aria-label="Ayuda e información">
        <a href="#/info/ayuda">Ayuda</a> · <a href="#/info/retiro">Retiro en el local</a> · <a href="#/info/devoluciones">Devoluciones</a> · <a href="#/info/contacto">Contacto</a> · <a href="#/info/accesibilidad">Accesibilidad</a> · <a href="privacidad.html">Privacidad</a>
      </nav>
      <span class="sm copy">© 2026 NQ Crown</span>
    </div>
  </footer>

  <!-- Aviso visible (microinteracciones) y región solo para lectores de pantalla -->
  <!-- Los botones del aviso se crean solo al mostrarlo (ningún botón queda vacío) -->
  <div class="toast" id="toast" role="status" aria-live="polite">
    <span class="toast__icon" id="toastIcon" aria-hidden="true"></span>
    <div class="toast__body">
      <p class="toast__msg" id="toastMsg"></p>
      <p class="toast__detail" id="toastDetail"></p>
    </div>
    <div class="toast__actions" id="toastActions"></div>
    <span class="toast__bar" aria-hidden="true"></span>
  </div>
  <div class="sr-only" id="srLive" aria-live="polite"></div>

  <!-- Carrito lateral (prueba): se abre al agregar una gorra -->
  <div class="drawer-bg" id="drawerBg" hidden></div>
  <aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle" hidden></aside>

  <noscript><p class="wrap">Esta tienda necesita JavaScript activado para funcionar.</p></noscript>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="js/data.js?v=8"></script>
  <script src="js/db.js?v=15"></script>
  <script src="js/app.js?v=24"></script>
</body>
</html>
